<!doctype html>
<html lang="ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#172b4d">
  <title>WonderWorld — 3D Prototype</title>
  <link rel="stylesheet" href="./style.css?v=20261023-4">
  <link rel="stylesheet" href="./career.css?v=20261021-2">
  <script type="importmap">
    {"imports":{"playcanvas":"https://cdn.jsdelivr.net/npm/playcanvas@2.7.3/build/playcanvas.mjs"}}
  </script>
</head>
<body>
  <main id="game">
    <canvas id="application" aria-label="WonderWorld 3D game"></canvas>
    <header class="hud"><div class="brand">WonderWorld</div><div class="hint">حرّكي بالعصا شمالًا، واسحبي يمين الشاشة للدوران 360° والنظر لفوق وتحت</div></header>
    <button id="references-toggle" type="button" aria-expanded="false" aria-controls="character-references">مراجع الشخصيات</button>
    <aside id="character-references" hidden aria-label="مراجع شخصيات WonderWorld">
      <div class="references-heading"><strong>مراجع الشخصيات</strong><button id="references-close" type="button" aria-label="إغلاق">✕</button></div>
      <p>الصور دي مراجع بصرية للتصميم، وليست نماذج شخصيات ثلاثية الأبعاد.</p>
      <div class="reference-grid" id="reference-grid"><p id="references-status">جاري تحميل صور الشخصيات…</p></div>
    </aside>
    <div class="touch-pad" aria-label="أزرار الحركة القديمة" hidden>
      <button class="move up" data-dir="up" aria-label="تحركي للأمام">▲</button><button class="move left" data-dir="left" aria-label="تحركي لليسار">◀</button><button class="move down" data-dir="down" aria-label="تحركي للخلف">▼</button><button class="move right" data-dir="right" aria-label="تحركي لليمين">▶</button>
    </div>
    <div id="move-joystick" class="move-joystick" role="application" aria-label="عصا افتراضية للحركة: اسحبي في الاتجاه المطلوب">
      <span class="joystick-direction joystick-up">▲</span><span class="joystick-direction joystick-down">▼</span><span class="joystick-direction joystick-left">◀</span><span class="joystick-direction joystick-right">▶</span>
      <span id="move-joystick-thumb" class="move-joystick-thumb"></span>
    </div>
    <div class="camera-look-hint" aria-hidden="true">اسحبي هنا لتحريك الكاميرا ↔</div>
    <div id="status" role="status">تحميل عالم 3D…</div>
  </main>
  <script>
    const toggle = document.getElementById('references-toggle');
    const panel = document.getElementById('character-references');
    const close = document.getElementById('references-close');
    function setReferencesOpen(open) { panel.hidden = !open; toggle.setAttribute('aria-expanded', String(open)); }
    toggle.addEventListener('click', () => setReferencesOpen(panel.hidden));
    close.addEventListener('click', () => setReferencesOpen(false));

    // Public client key only. Never put a Supabase service-role or secret key in browser code.
    const SUPABASE_URL = 'https://kkfmrvgpendfziejscsz.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_aOosJXpV_6B_ErSwVFJ1zQ_ZAq_nksS';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtrZm1ydmdwZW5kZnppZWpzY3N6IiwidG9sZSI6ImFub24iLCJpYXQiOjE3OTIzNDEwNDQsImV4cCI6MjEwNzkxNzA0NH0.mRkvdoBKTgjCbwipC2ukQQsEgueevEMY-1eR4GpUKfc';
    const BUCKET = 'Wonder World Game';
    const grid = document.getElementById('reference-grid');
    const referenceStatus = document.getElementById('references-status');

    async function loadCharacterReferences() {
      try {
        const allFiles = [];
        let offset = 0;
        const limit = 100;
        while (true) {
          const response = await fetch(
            SUPABASE_URL + '/storage/v1/object/list/' + encodeURIComponent(BUCKET),
            {
              method: 'POST',
              headers: {
                apikey: SUPABASE_PUBLISHABLE_KEY,
                Authorization: 'Bearer ' + SUPABASE_ANON_KEY,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({ prefix: 'characters', limit, offset, sortBy: { column: 'name', order: 'asc' } })
            }
          );
          if (!response.ok) throw new Error('Supabase Storage list failed: ' + response.status);
          const files = await response.json();
          allFiles.push(...files.filter(file => /\.(avif|gif|jpe?g|png|webp|bmp)$/i.test(file.name || '')));
          if (files.length < limit) break;
          offset += limit;
        }
        grid.replaceChildren();
        if (!allFiles.length) {
          const message = document.createElement('p');
          message.textContent = 'لسه مفيش صور داخل مجلد characters في Supabase.';
          grid.appendChild(message);
          return;
        }
        for (const file of allFiles) {
          const figure = document.createElement('figure');
          const image = document.createElement('img');
          const caption = document.createElement('figcaption');
          const objectPath = 'characters/' + file.name.split('/').map(encodeURIComponent).join('/');
          image.src = SUPABASE_URL + '/storage/v1/object/public/' + encodeURIComponent(BUCKET) + '/' + objectPath;
          image.alt = file.name; image.loading = 'lazy'; caption.textContent = file.name;
          figure.append(image, caption); grid.appendChild(figure);
        }
      } catch (error) {
        console.error(error);
        if (referenceStatus) referenceStatus.textContent = 'تعذّر تحميل الصور من Supabase. راجعي اتصال Storage وسياسة عرض قائمة الصور.';
      }
    }
    loadCharacterReferences();
  </script>
  <script type="module" src="./auth.js?v=20261022-5"></script>
  <script type="module" src="./main.js?v=20261023-4"></script>
  <script src="./careers.js?v=20261021-3" defer></script>
  <script src="./mini-games.js?v=20261022-4" defer></script>
  <script src="./wonderworld-activities.js?v=20261023-1" defer></script>
  <script src="./space-shooter.js?v=20261022-1" defer></script>
  <script src="./wonder-challenges.js?v=20261022-1" defer></script>
  <script src="./wonder-memory.js?v=20261022-2" defer></script>
</body>
</html>
