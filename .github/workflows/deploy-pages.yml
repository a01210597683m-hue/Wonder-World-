name: Deploy WonderWorld to GitHub Pages

on:
  push:
    branches: [main, 'rebuild/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Keep PR validation separate from production deployments and isolate each PR revision.
  # A stale queued check must not block validation of the newest commit.
  group: pages-${{ github.event.pull_request.number && format('pr-{0}-{1}', github.event.pull_request.number, github.sha) || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --input-type=module --check < main.js
          node --input-type=module --check < auth.js
          node --check careers.js
          node --check board-games.js
          node --check mini-games.js
          node --check wonder-challenges.js
          node --check wonder-memory.js
          node --check scripts/check-game.mjs
          node --check scripts/check-assets.mjs
          node --check scripts/smoke-browser.mjs
      - name: Check activity module JavaScript syntax
        run: node --check wonderworld-activities.js
      - name: Check Space Shooter JavaScript syntax
        run: node --check space-shooter.js
      - name: Run gameplay regression checks
        run: node scripts/check-game.mjs
      - name: Run asset and integration checks
        run: node scripts/check-assets.mjs
      - name: Install browser smoke-test dependencies
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium for browser smoke tests
        timeout-minutes: 8
        run: npx playwright install chromium
      - name: Run browser gameplay smoke tests
        run: node scripts/smoke-browser.mjs
      - name: Assemble clean Pages site
        run: |
          mkdir -p _site
          cp index.html style.css career.css wonderworld-hub.css wonderworld-world-first.css wonderworld-polish.css wonderworld-menu-readable.css wonderworld-ui-correction.css auth.js main.js careers.js board-games.js mini-games.js wonderworld-activities.js space-shooter.js wonder-challenges.js wonder-memory.js wonderworld-hub.js _site/
          cp -R assets game-design-references App-Branding _site/
          test -f _site/index.html
          test ! -d _site/node_modules
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
